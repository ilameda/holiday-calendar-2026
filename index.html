        function renderScene() {
            const scene = scenes[currentScene];
            const app = document.getElementById('app');
            
            app.innerHTML = `
                <div class="text-center mb-8">
                    <h1 class="text-5xl font-bold bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-400 bg-clip-text text-transparent mb-2">
                        Dev Team Space Bar Chronicles
                    </h1>
                    <p class="text-gray-400 text-sm italic">A True Story That Started at 5 AM on a Friday Morning 🚀🍸</p>
                    <p class="text-red-400 text-xs mt-1 animate-pulse">⚠️ If this is what happened by 9 AM... God help us all ⚠️</p>
                </div>
                
                <div class="rounded-lg shadow-2xl p-8 min-h-[600px]" style="background: ${scene.background}">
                    <div class="max-w-4xl mx-auto">
                        <div class="text-center mb-8">
                            <h2 class="text-3xl font-bold text-white mb-2">${scene.title}</h2>
                            <div class="flex items-center justify-center gap-2 text-gray-300">
                                <span class="text-sm">Scene ${currentScene + 1} of ${scenes.length}</span>
                            </div>
                        </div>
                        
                        <div class="min-h-[400px]">
                            ${scene.content}
                        </div>
                        
                        <div class="flex justify-between items-center mt-8 pt-6 border-t border-gray-700">
                            <button
                                onclick="prevScene()"
                                ${currentScene === 0 ? 'disabled' : ''}
                                class="px-6 py-3 bg-purple-600 text-white rounded-lg hover:bg-purple-700 disabled:bg-gray-700 disabled:cursor-not-allowed transition-colors"
                            >
                                ← Previous
                            </button>
                            
                            <div class="flex gap-2">
                                ${scenes.map((_, idx) => `
                                    <button
                                        onclick="goToScene(${idx})"
                                        class="w-3 h-3 rounded-full transition-colors ${
                                            idx === currentScene ? 'bg-cyan-400' : 'bg-gray-600 hover:bg-gray-500'
                                        }"
                                    ></button>
                                `).join('')}
                            </div>
                            
                            <button
                                onclick="nextScene()"
                                ${currentScene === scenes.length - 1 ? 'disabled' : ''}
                                class="px-6 py-3 bg-purple-600 text-white rounded-lg hover:bg-purple-700 disabled:bg-gray-700 disabled:cursor-not-allowed transition-colors"
                            >
                                Next →
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="max-w-4xl mx-auto mt-6 text-center">
                    <p class="text-gray-400 text-sm">
                        🚀 The most Friday-ish MORNING of all times 🍸👽🫒
                    </p>
                    <p class="text-gray-500 text-xs mt-2">
                        Featuring: Actual work (TDE-8061), space bars, olive conspiracies, Isabel's master plan, and one AI trying its best
                    </p>
                </div>
            `;
        }

        function nextScene() {
            if (currentScene < scenes.length - 1) {
                currentScene++;
                renderScene();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function prevScene() {
            if (currentScene > 0) {
                currentScene--;
                renderScene();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function goToScene(index) {
            currentScene = index;
            renderScene();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextScene();
            if (e.key === 'ArrowLeft') prevScene();
        });

        // Initial render
        renderScene();
    </script>
